[project]
name = "asset-pipeline"
version = "0.1.0"
description = "Builds and optimizes AI Sims character assets with headless Blender"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
asset-pipeline = "asset_pipeline.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8",
    "fake-bpy-module-latest",
    "swig>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unreal-side helpers (pipeline/unreal) are imported by tests without Unreal.
pythonpath = ["unreal"]
